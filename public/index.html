<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void TP Machine - Minecraft Bedrock Add-on</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0c1b;
            color: #e2d9f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: #18132b;
            border: 2px solid #6b21a8;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(107, 33, 168, 0.4);
            text-align: center;
        }
        h1 { color: #a855f7; font-size: 2.2rem; margin-bottom: 12px; }
        p { color: #c084fc; font-size: 1.05rem; margin-bottom: 24px; }
        .badge {
            display: inline-block;
            background: #3b0764;
            color: #f3e8ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #7e22ce, #9333ea);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 16px 36px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Minecraft Bedrock 1.21.100+ Uyumlu</div>
        <h1>Void TP Machine</h1>
        <p>Işınlanma makineleri kurun, dünyanızı özgürce gezinin!</p>
        <a href="/download" class="btn">⚡ .mcaddon İndir ve Kur</a>
    </div>
</body>
</html>
